services:
  database:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: giross-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giross}
      POSTGRES_USER: ${POSTGRES_USER:-giross}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-giross_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 600s

  redis:
    image: redis:8.8-alpine
    container_name: giross-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env} --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: giross-api
    restart: unless-stopped

    init: true
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-giross}:${POSTGRES_PASSWORD:-giross_dev}@database:5432/${POSTGRES_DB:-giross}
      REDIS_URL: redis://default:${REDIS_PASSWORD}@redis:6379
      GEOCODING_API_URL: ${GEOCODING_API_URL:-https://cep.awesomeapi.com.br/json/}
      GEOCODING_TIMEOUT_MS: ${GEOCODING_TIMEOUT_MS:-5000}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-60}
      CACHE_DELETE_RATE_LIMIT_PER_MINUTE: ${CACHE_DELETE_RATE_LIMIT_PER_MINUTE:-5}
      GEOCODING_RATE_LIMIT_PER_MINUTE: ${GEOCODING_RATE_LIMIT_PER_MINUTE:-30}
      TRUST_PROXY: ${TRUST_PROXY:-}
    ports:
      - "${PORT:-3000}:3000"

volumes:
  postgres_data:
  redis_data:
